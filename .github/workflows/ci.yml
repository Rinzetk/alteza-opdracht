name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint en tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python instellen
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installeren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linting met flake8
        run: flake8 src tests

      - name: Linting met pylint
        run: pylint src

      # Met GITHUB_TOKEN draaien ook de live tests (@pytest.mark.integration)
      # mee. Het automatische token van Actions is genoeg: de tests lezen
      # alleen een publieke repository.
      - name: Tests met coverage (inclusief live tests)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pytest --cov --cov-report=term-missing

      - name: Coverage-rapport in de samenvatting
        if: always()
        run: |
          echo "## Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
