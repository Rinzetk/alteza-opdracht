name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: flake8 src tests

      - name: Lint with pylint
        run: pylint src

      # With GITHUB_TOKEN set, the live tests (@pytest.mark.integration) run
      # as well. The automatic Actions token is enough: the tests only read a
      # public repository.
      - name: Tests with coverage (including live tests)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pytest --cov --cov-report=term-missing

      - name: Coverage report in the job summary
        if: always()
        run: |
          echo "## Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Build and check the Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the Docker images
        run: docker compose build

      - name: CLI image starts as a non-root user
        run: |
          docker run --rm github-commits:latest --help
          test "$(docker run --rm --entrypoint whoami github-commits:latest)" = "app"

      - name: Tests in the container
        run: docker compose run --rm test
